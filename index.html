<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5c84c" />
    <meta name="description" content="O botão oficial do marreco." />
    <title>Botão Gaivota</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { display: ['Arial Black', 'Arial', 'sans-serif'] },
            colors: { ink: '#17231d', duck: '#f5c84c', cream: '#fff7df' },
            boxShadow: {
              button: '0 18px 0 #a85e21, 0 28px 50px rgba(32, 25, 12, .25)',
              pressed: '0 4px 0 #a85e21, 0 10px 22px rgba(32, 25, 12, .18)'
            }
          }
        }
      };
    </script>
    <style>
      body { -webkit-tap-highlight-color: transparent; }
      .noise {
        background-image: radial-gradient(rgba(23,35,29,.11) 1px, transparent 1px);
        background-size: 18px 18px;
      }
      @keyframes ripple {
        from { transform: scale(.35); opacity: 1; }
        to { transform: scale(2.15); opacity: 0; }
      }
      .ripple { animation: ripple .55s ease-out forwards; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; }
      }
    </style>
  </head>
  <body class="min-h-screen overflow-hidden bg-cream text-ink selection:bg-duck">
    <main class="noise relative h-[100svh] overflow-hidden px-5">
      <div class="pointer-events-none absolute left-[-8rem] top-[-8rem] h-80 w-80 rounded-full bg-duck/50 blur-3xl"></div>
      <div class="pointer-events-none absolute bottom-[-10rem] right-[-7rem] h-96 w-96 rounded-full bg-emerald-700/20 blur-3xl"></div>

      <section class="relative z-10 mx-auto h-full w-full max-w-xl text-center">
        <nav class="absolute left-1/2 top-[max(.75rem,env(safe-area-inset-top))] flex w-44 -translate-x-1/2 flex-wrap justify-center gap-1 min-[380px]:w-56 min-[380px]:gap-1.5 sm:w-[19.5rem] sm:gap-2" aria-label="Escolha um animal">
          <button type="button" data-animal="gaivota" aria-label="Selecionar gaivota" aria-pressed="true" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-4 ring-emerald-700 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/gaivota.jpg" alt="Gaivota" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="gaivota" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
          <button type="button" data-animal="cabra" aria-label="Selecionar cabra" aria-pressed="false" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-2 ring-ink/15 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/cabra.jpg" alt="Cabra" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="cabra" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
          <button type="button" data-animal="sapo" aria-label="Selecionar sapo" aria-pressed="false" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-2 ring-ink/15 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/sapo.jpg" alt="Sapo" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="sapo" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
          <button type="button" data-animal="pato" aria-label="Selecionar pato" aria-pressed="false" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-2 ring-ink/15 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/pato.jpg" alt="Pato" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="pato" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
          <button type="button" data-animal="galinha" aria-label="Selecionar galinha" aria-pressed="false" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-2 ring-ink/15 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/galinha.jpg" alt="Galinha" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="galinha" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
          <button type="button" data-animal="boi" aria-label="Selecionar boi" aria-pressed="false" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-2 ring-ink/15 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/vaca.jpg" alt="Boi" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="boi" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
          <button type="button" data-animal="galo" aria-label="Selecionar galo" aria-pressed="false" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-2 ring-ink/15 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/galo.jpg" alt="Galo" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="galo" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
          <button type="button" data-animal="grilo" aria-label="Selecionar grilo" aria-pressed="false" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-2 ring-ink/15 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/grilo.jpg" alt="Grilo" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="grilo" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
          <button type="button" data-animal="tom" aria-label="Selecionar Tom" aria-pressed="false" class="animal-selector relative h-8 w-8 rounded-full border-2 border-white shadow-md ring-2 ring-ink/15 transition hover:scale-105 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-ink min-[380px]:h-10 min-[380px]:w-10 sm:h-14 sm:w-14">
            <img src="./assets/animals/tom.jpg" alt="Tom" class="h-full w-full rounded-full object-cover" />
            <span data-count-for="tom" class="sound-count absolute -right-1 -top-1 z-20 hidden min-w-4 rounded-full bg-ink px-1 text-[9px] font-bold leading-4 text-white">0</span>
          </button>
        </nav>

        <header class="absolute inset-x-0 top-[5.5rem] min-[380px]:top-[7rem] sm:top-[9rem]">
          <p class="mb-2 text-[10px] font-bold uppercase tracking-[0.35em] text-ink/55 sm:text-xs">Aperte sem moderação</p>
          <h1 id="pageTitle" class="font-display text-3xl uppercase leading-none sm:text-5xl">Botão Gaivota</h1>
          <p id="pageDescription" class="mx-auto mt-2 hidden max-w-sm text-sm font-medium text-ink/60 min-[380px]:block">Cada toque solta um novo grito e corta o som anterior.</p>
        </header>

        <button
          id="soundButton"
          type="button"
          aria-label="Tocar som da gaivota"
          class="group absolute left-1/2 top-1/2 grid aspect-square w-[min(58vw,34svh,17rem)] -translate-x-1/2 -translate-y-1/2 touch-pan-y select-none place-items-center overflow-hidden rounded-full border-[10px] border-amber-100 bg-duck shadow-button outline-none transition duration-100 hover:brightness-105 focus-visible:ring-4 focus-visible:ring-emerald-700 focus-visible:ring-offset-4 focus-visible:ring-offset-cream active:translate-y-[calc(-50%+14px)] active:shadow-pressed sm:w-[min(68vw,34svh,17rem)]"
        >
          <span id="ripple" class="pointer-events-none absolute h-24 w-24 rounded-full bg-white/60 opacity-0"></span>
          <img id="centerAnimal" src="./assets/animals/gaivota.jpg" alt="Gaivota" class="relative z-10 aspect-square w-[58%] rounded-full border-4 border-white/70 object-cover shadow-lg transition-transform duration-150 group-hover:rotate-[-3deg] group-active:scale-90" />
          <span id="soundLabel" class="relative z-10 mt-[-1.5rem] font-display text-lg uppercase tracking-[0.18em] sm:text-xl">Kriá!</span>
        </button>

        <div class="absolute bottom-[max(1.25rem,env(safe-area-inset-bottom))] left-1/2 flex -translate-x-1/2 items-center gap-3 whitespace-nowrap rounded-full border border-ink/10 bg-white/55 px-4 py-2 text-xs font-bold uppercase tracking-widest text-ink/55 backdrop-blur-sm">
          <span id="statusDot" class="h-2 w-2 rounded-full bg-emerald-600"></span>
          <span id="counter" aria-live="polite">Pronta para gritar</span>
        </div>
      </section>
    </main>

    <script>
      const animals = {
        gaivota: {
          name: 'Gaivota', image: './assets/animals/gaivota.jpg', audio: './assets/gaivota.mp3?v=20261117-4',
          label: 'Kriá!', description: 'Cada toque solta um novo grito e corta o som anterior.',
          ready: 'Pronta para gritar', singular: 'grito', plural: 'gritos'
        },
        cabra: {
          name: 'Cabra', image: './assets/animals/cabra.jpg', audio: './assets/cabra.mp3?v=20261117-2',
          label: 'Mééé!', description: 'Cada toque solta um novo grito e corta o berro anterior.',
          ready: 'Pronta para berrar', singular: 'berro', plural: 'berros'
        },
        sapo: {
          name: 'Sapo', image: './assets/animals/sapo.jpg', audio: './assets/sapo.mp3?v=20261117-2',
          label: 'Croac!', description: 'Cada toque solta um novo coaxo e corta o som anterior.',
          ready: 'Pronto para coaxar', singular: 'coaxo', plural: 'coaxos'
        },
        pato: {
          name: 'Pato', image: './assets/animals/pato.jpg', audio: './assets/pato.mp3?v=20261117-4',
          label: 'Quack!', description: 'Cada toque solta uma nova grasnada e corta o som anterior.',
          ready: 'Pronto para grasnar', singular: 'grasnada', plural: 'grasnadas'
        },
        galinha: {
          name: 'Galinha', image: './assets/animals/galinha.jpg', audio: './assets/galinha.mp3?v=20261117-5',
          label: 'Có-có!', description: 'Cada toque solta um novo cacarejo e corta o som anterior.',
          ready: 'Pronta para cacarejar', singular: 'cacarejo', plural: 'cacarejos'
        },
        boi: {
          name: 'Boi', image: './assets/animals/vaca.jpg', audio: './assets/boi.mp3?v=20261117-5',
          label: 'Muuu!', description: 'Cada toque solta um novo mugido e corta o som anterior.',
          ready: 'Pronto para mugir', singular: 'mugido', plural: 'mugidos'
        },
        galo: {
          name: 'Galo', image: './assets/animals/galo.jpg', audio: './assets/galo.mp3?v=20261117-6',
          label: 'Cocoricó!', description: 'Cada toque solta um novo canto e corta o som anterior.',
          ready: 'Pronto para cantar', singular: 'canto', plural: 'cantos'
        },
        grilo: {
          name: 'Grilo', image: './assets/animals/grilo.jpg', audio: './assets/grilo.mp3?v=20261117-6',
          label: 'Cri-cri!', description: 'Cada toque solta um novo cricri e corta o som anterior.',
          ready: 'Pronto para cricrilar', singular: 'cricri', plural: 'cricris'
        },
        tom: {
          name: 'Tom', image: './assets/animals/tom.jpg', audio: './assets/tom.mp3?v=20261117-7',
          label: 'Aaaah!', description: 'Cada toque solta um novo grito e corta o som anterior.',
          ready: 'Pronto para gritar', singular: 'grito', plural: 'gritos'
        }
      };

      const button = document.querySelector('#soundButton');
      const counter = document.querySelector('#counter');
      const ripple = document.querySelector('#ripple');
      const pageTitle = document.querySelector('#pageTitle');
      const pageDescription = document.querySelector('#pageDescription');
      const centerAnimal = document.querySelector('#centerAnimal');
      const soundLabel = document.querySelector('#soundLabel');
      const selectors = document.querySelectorAll('.animal-selector');
      const countBadges = document.querySelectorAll('.sound-count');
      const countBadgesByAnimal = new Map(
        [...countBadges].map((badge) => [badge.dataset.countFor, badge])
      );
      const animalOrder = Object.keys(animals);
      let selectedAnimal = 'gaivota';
      const audio = new Audio(animals[selectedAnimal].audio);
      audio.preload = 'auto';
      let plays = 0;
      let soundCounts = {};
      let pointerStartX = null;
      let suppressNextClick = false;
      let suppressClickTimer = null;
      let storageWriteTimer = null;

      try {
        soundCounts = JSON.parse(localStorage.getItem('animalSoundCounts') || '{}');
      } catch {
        soundCounts = {};
      }

      function renderSoundCount(key) {
        const badge = countBadgesByAnimal.get(key);
        if (!badge) return;
        const count = Number(soundCounts[key]) || 0;
        badge.textContent = count > 999 ? '999+' : String(count);
        badge.classList.toggle('hidden', count === 0);
      }

      function persistSoundCounts() {
        if (storageWriteTimer) {
          window.clearTimeout(storageWriteTimer);
          storageWriteTimer = null;
        }

        try {
          localStorage.setItem('animalSoundCounts', JSON.stringify(soundCounts));
        } catch {
          // O app continua funcionando quando o armazenamento está indisponível.
        }
      }

      function recordSoundPlay(key) {
        soundCounts[key] = (Number(soundCounts[key]) || 0) + 1;
        renderSoundCount(key);
        window.clearTimeout(storageWriteTimer);
        storageWriteTimer = window.setTimeout(persistSoundCounts, 250);
      }

      function selectAnimal(key) {
        if (key === selectedAnimal) return;
        selectedAnimal = key;
        const animal = animals[key];
        audio.pause();
        audio.src = animal.audio;
        audio.load();
        plays = 0;
        pageTitle.textContent = `Botão ${animal.name}`;
        document.title = `Botão ${animal.name}`;
        pageDescription.textContent = animal.description;
        centerAnimal.src = animal.image;
        centerAnimal.alt = animal.name;
        soundLabel.textContent = animal.label;
        const article = ['sapo', 'pato', 'boi', 'galo', 'grilo', 'tom'].includes(key) ? 'do' : 'da';
        button.setAttribute('aria-label', `Tocar som ${article} ${animal.name.toLowerCase()}`);
        counter.textContent = animal.ready;

        selectors.forEach((selector) => {
          const active = selector.dataset.animal === key;
          selector.setAttribute('aria-pressed', String(active));
          selector.classList.toggle('ring-4', active);
          selector.classList.toggle('ring-emerald-700', active);
          selector.classList.toggle('ring-2', !active);
          selector.classList.toggle('ring-ink/15', !active);
        });
      }

      function selectAdjacentAnimal(direction) {
        const currentIndex = animalOrder.indexOf(selectedAnimal);
        const nextIndex = (currentIndex + direction + animalOrder.length) % animalOrder.length;
        selectAnimal(animalOrder[nextIndex]);
      }

      function playDuck(event) {
        if (suppressNextClick) {
          suppressNextClick = false;
          return;
        }

        // Interrompe a reprodução atual e reinicia o som do começo.
        audio.pause();
        audio.currentTime = 0;
        audio.volume = 1;
        audio.play().catch(() => {
          counter.textContent = 'Toque novamente para liberar o som';
        });

        plays += 1;
        const animal = animals[selectedAnimal];
        counter.textContent = plays === 1 ? `1 ${animal.singular}` : `${plays} ${animal.plural}`;
        recordSoundPlay(selectedAnimal);

        const rect = button.getBoundingClientRect();
        const x = (event.clientX || rect.left + rect.width / 2) - rect.left;
        const y = (event.clientY || rect.top + rect.height / 2) - rect.top;
        ripple.style.left = `${x - 48}px`;
        ripple.style.top = `${y - 48}px`;
        ripple.classList.remove('ripple');
        void ripple.offsetWidth;
        ripple.classList.add('ripple');
      }

      button.addEventListener('click', playDuck);
      selectors.forEach((selector) => {
        selector.addEventListener('click', () => selectAnimal(selector.dataset.animal));
      });

      button.addEventListener('pointerdown', (event) => {
        pointerStartX = event.clientX;
        button.setPointerCapture?.(event.pointerId);
      });

      button.addEventListener('pointerup', (event) => {
        if (pointerStartX === null) return;
        const distance = event.clientX - pointerStartX;
        pointerStartX = null;

        if (Math.abs(distance) >= 40) {
          suppressNextClick = true;
          selectAdjacentAnimal(distance < 0 ? 1 : -1);
          window.clearTimeout(suppressClickTimer);
          suppressClickTimer = window.setTimeout(() => {
            suppressNextClick = false;
            suppressClickTimer = null;
          }, 350);
        }
      });

      button.addEventListener('pointercancel', () => {
        pointerStartX = null;
      });

      button.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          selectAdjacentAnimal(event.key === 'ArrowRight' ? 1 : -1);
        }
      });
      window.addEventListener('pagehide', persistSoundCounts, { passive: true });
      countBadges.forEach((badge) => renderSoundCount(badge.dataset.countFor));
    </script>
  </body>
</html>
